<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070b18">
  <meta name="description" content="借用四种壳体，解开三个设施舱段。最后可以留壳压住北门，或带着护盾绕过南侧光束。">
  <title>寄壳行动 · XXSX 游戏站</title>
  <link rel="icon" href="../assets/icons/shell-heist.d36d70a1ec15.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../static/shell-heist.38a2d1ce65af.css">
  <script defer src="../static/shell-heist.6b4fb78dfdcd.js"></script>
</head>
<body>
  <header class="mast">
    <div class="wrap mast-inner">
      <a class="back" href="../">← 所有游戏</a>
      <span class="signal">SHELL HEIST <i></i> FACILITY 07</span>
    </div>
  </header>
  <main class="wrap" id="shell-game">
    <div class="intro">
      <div>
        <h1>寄壳行动</h1>
        <p>借用四种壳体。留下它们的最后一步，为自己打开下一道门。</p>
      </div>
      <nav class="rooms" aria-label="选择舱段">
        <span id="progress-count">撤离 0 / 3</span>
        <button type="button" data-room="0" disabled>01</button>
        <button type="button" data-room="1" disabled>02</button>
        <button type="button" data-room="2" disabled>03</button>
      </nav>
    </div>
    <noscript><p>请启用 JavaScript，再进入设施。</p></noscript>

    <div class="workbench" id="workbench" hidden>
      <section class="playfield" aria-labelledby="room-title">
        <div class="field-head">
          <div>
            <span id="room-code" class="label"></span>
            <h2 id="room-title" tabindex="-1"></h2>
          </div>
          <div class="readout"><b><span id="turns">00</span> 步</b><span id="shell-status"></span></div>
        </div>

        <div class="map-frame"><table id="map"><tbody id="map-body"></tbody></table></div>

        <div class="movement" role="group" aria-label="移动一格">
          <button type="button" data-turn="left" aria-label="向左移动">←</button>
          <button type="button" data-turn="up" aria-label="向上移动">↑</button>
          <button type="button" data-turn="down" aria-label="向下移动">↓</button>
          <button type="button" data-turn="right" aria-label="向右移动">→</button>
        </div>
        <label id="borrow-choice" hidden>选择壳体<select id="borrow-target"></select></label>
        <div class="actions" role="group" aria-label="壳体操作">
          <button class="primary" type="button" data-turn="borrow">寄壳</button>
          <button type="button" data-turn="ability">能力</button>
          <button type="button" data-turn="leave">离壳</button>
          <button type="button" data-turn="interact">交互</button>
        </div>
        <p class="feedback" id="status" role="status" aria-atomic="true"></p>
        <div class="run-actions">
          <button type="button" id="undo" title="撤销一步 (Z)">撤销</button>
          <button type="button" id="restart">重开本舱</button>
          <button class="primary" type="button" id="next-room" hidden>下一舱 →</button>
        </div>
      </section>

      <section class="brief" aria-labelledby="brief-title">
        <div class="brief-head">
          <span class="label">LINK / SHELL</span>
          <h2 id="brief-title"><span id="current-shell"></span></h2>
          <p id="shell-rule"></p>
          <p id="coast" class="prediction"></p>
        </div>
        <ul class="goals" aria-label="撤离目标">
          <li id="goal-a"></li><li id="goal-b"></li><li id="goal-exit"></li>
        </ul>
        <details><summary>卡住了？查看本舱提示</summary><p id="room-hint"></p></details>
        <details>
          <summary>地图图例与键盘操作</summary>
          <p>● 本体 · ↯ 冲锋 · ⊙ 炮台 · ⌁ 侦察 · ◇ 护盾</p>
          <p>▥ 门 · ▣ 压板 · ≋ 激光 · ? 维护通道 · ↗ 出口</p>
          <p>方向键 / WASD 移动，E 寄壳，X 能力，Q 离壳，F 交互，Z 撤销。每个有效操作前进一步；碰壁不扣步。</p>
        </details>
        <div class="archive">
          <span id="best-steps"></span>
          <span id="route-record" hidden></span>
          <span>局内每步保存到本机。切换舱段会结束当前尝试，撤离成绩保留。</span>
          <strong id="save-status" role="status" hidden></strong>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
