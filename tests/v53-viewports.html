<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>V53 游戏视口检查</title><style>body{background:#333;color:white;font-family:system-ui}section{display:inline-block;vertical-align:top;margin:10px}iframe{display:block;border:1px solid #888;height:1000px}</style><h1>三款新战役 · 宽度与文字检查</h1><div id="frames"></div><script>for(const game of ['salvage','lab','relay'])for(const width of [320,375,414,768,'320/200%']){const enlarged=typeof width==='string',section=document.createElement('section'),title=document.createElement('h2'),frame=document.createElement('iframe');title.textContent=game+' · '+width;frame.title=title.textContent;frame.width=enlarged?320:width;frame.src='../play.html#game/'+game;if(enlarged)frame.onload=function(){frame.contentDocument.documentElement.style.fontSize='32px';};section.append(title,frame);document.getElementById('frames').append(section);}</script></html>
