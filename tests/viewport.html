<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>Neon Drift · 视口检查</title>
<style>
  body{margin:0;padding:12px;background:#20232b;color:#eee;font:14px system-ui}
  label{display:block;margin-bottom:12px}select{padding:8px}
  iframe{display:block;border:0;width:390px;height:844px}
</style>
<label>检查尺寸 <select id="viewport">
  <option value="390,844">手机竖屏 390 × 844</option>
  <option value="320,568">小屏 320 × 568</option>
  <option value="844,390">手机横屏 844 × 390</option>
</select></label>
<iframe id="gameFrame" title="游戏视口" src="../dist/index.html"></iframe>
<script>
  document.querySelector('#viewport').addEventListener('change',event=>{
    const [width,height]=event.target.value.split(',');
    const frame=document.querySelector('#gameFrame');
    frame.style.width=width+'px';frame.style.height=height+'px';
  });
</script>
</html>
